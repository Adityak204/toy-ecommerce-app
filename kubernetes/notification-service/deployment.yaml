apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: toy-ecommerce-app-notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
              name: http
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            - name: ENVIRONMENT
              value: "production"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
            livenessProbe:
              httpGet:
                path: /health
                port: 8002
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8002
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 3
