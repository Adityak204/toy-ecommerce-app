apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ecommerce
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
              name: amqp
              protocol: TCP
            - containerPort: 15672
              name: management
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
            livenessProbe:
              exec:
                command:
                  - rabbitmq-diagnostics
                  - -q
                  - ping
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
            readinessProbe:
              exec:
                command:
                  - rabbitmq-diagnostics
                  - -q
                  - check_port_connectivity
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
